<html lang="lt">

<meta name="description" content="March gidas – TCCC 2026 MARCH PAWS atminties priemonė MEDEVAC šauliams gelbėtojams (CLS / CMC): CUF, TFC, TACEVAC, 9-Line, MIST.">
<title>March gidas</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
/* ── spalvos: mokymosi (šviesus) ir taikymo (tamsus, alyvuogių) režimai ── */
:root{--bg:#F3F4EE;--card:#fff;--line:#D9DCCD;--tx:#23271E;--tx2:#575E4D;--acc:#3B5A1C;--accbg:#E5EDD6;--red:#7A1F1F;--redbg:#FBE7E4;--amb:#663A04;--ambbg:#FAEAD0;--grn:#0B4F38;--grnbg:#DCF1E5;--hl:#F3CF73;--ok:#2E8B57;--sh:0 1px 2px rgba(30,35,20,.06)}
body.field{--bg:#161912;--card:#22271C;--line:#3A4230;--tx:#EEF0E5;--tx2:#B3B9A4;--acc:#C4D99A;--accbg:#37462A;--red:#FFE1DC;--redbg:#7A1F1F;--amb:#F9CF7E;--ambbg:#5A3907;--grn:#A6E3BC;--grnbg:#164A2F;--hl:#9C7417;--ok:#3FA36B;--sh:none}
@media(prefers-color-scheme:dark){body.learn{--bg:#161912;--card:#22271C;--line:#3A4230;--tx:#EEF0E5;--tx2:#B3B9A4;--acc:#C4D99A;--accbg:#37462A;--red:#F7C6BF;--redbg:#5C1717;--amb:#F9CF7E;--ambbg:#46300A;--grn:#A6E3BC;--grnbg:#123D27;--hl:#9C7417;--ok:#3FA36B;--sh:none}}
/* MIST kortelė: kūno schema ir M / I / S / T skiltys */
:root{--abn:#B42318;--mkr:#fff;--bfill:#E4E7DA;--bline:#878D7A;--sMc:#B42318;--sMb:#FDECEA;--sMf:#7A1F1F;--sIc:#B35300;--sIb:#FFF1DF;--sIf:#6B3300;--sSc:#1D5FB4;--sSb:#E6F0FC;--sSf:#0C447C;--sTc:#18794E;--sTb:#E2F4EA;--sTf:#085041}
body.field{--abn:#FF9B91;--mkr:#EEF0E5;--bfill:#3B4232;--bline:#A2A893;--sMb:#4A1714;--sMf:#FFD9D4;--sIb:#472A06;--sIf:#FFD9A6;--sSb:#11304F;--sSf:#CFE3FA;--sTb:#0F3B28;--sTf:#BDEBCB}
@media(prefers-color-scheme:dark){body.learn{--abn:#FF9B91;--mkr:#EEF0E5;--bfill:#3B4232;--bline:#A2A893;--sMb:#4A1714;--sMf:#FFD9D4;--sIb:#472A06;--sIf:#FFD9A6;--sSb:#11304F;--sSf:#CFE3FA;--sTb:#0F3B28;--sTf:#BDEBCB}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow-wrap:break-word}
body.field{font-size:17px;color-scheme:dark}
body.learn{color-scheme:light}
@media(prefers-color-scheme:dark){body.learn{color-scheme:dark}}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* ── antraštė ir apatinė navigacija ── */
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:8px max(10px,calc((100% - 720px) / 2));padding-top:max(8px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
.seg{flex:1;display:flex;gap:3px;padding:3px;background:var(--card);border-radius:10px;min-width:0}
.seg button{flex:1;border:0;background:none;color:var(--tx2);font:inherit;font-size:15px;padding:8px 0;border-radius:8px;min-width:0;min-height:40px}
.seg button.on{background:var(--tx);color:var(--bg);font-weight:600}
.ib{flex:none;width:42px;height:42px;border:0;border-radius:10px;background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:22px;height:22px}
@media(max-width:360px){header{gap:6px;padding-left:8px;padding-right:8px}.ib{width:38px}.seg button{font-size:14px}}
main{max-width:720px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:4px 4px max(4px,env(safe-area-inset-bottom))}
#nav a{flex:1;max-width:144px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--tx2);text-decoration:none;font-size:11px;border-radius:10px;min-width:0}
#nav a svg{width:22px;height:22px}
#nav a.on{color:var(--acc);font-weight:700;background:var(--accbg)}
/* ── tipografija ir bendri elementai ── */
h1{font-size:21px;margin:4px 0 10px;line-height:1.25}
h2{font-size:14px;font-weight:600;color:var(--tx2);margin:18px 0 8px}
h3{font-size:16px;margin:16px 0 4px;scroll-margin-top:72px}
p{margin:6px 0} a{color:var(--acc)} ul,ol{padding-left:20px}
.muted{color:var(--tx2);font-size:14px}
.lead{font-size:16px;margin:10px 0}
mark{background:var(--hl);color:inherit;border-radius:3px}
body.field mark{color:#fff}
@media(prefers-color-scheme:dark){body.learn mark{color:#fff}}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);text-decoration:none;font:inherit;text-align:left;box-shadow:var(--sh)}
.row>div{min-width:0}
.row small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--tx2);font-size:13px}
.row .ar{margin-left:auto;color:var(--tx2);font-size:20px;flex:none}
.row .tag{flex:none;margin:0}
.row.nxt{background:var(--accbg);color:var(--acc);border-color:var(--accbg);font-weight:600;margin-top:14px}
.row.nxt .ar{color:var(--acc)}
.card{padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--sh)}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;font:inherit;font-size:15px;text-decoration:none;text-align:center;min-height:44px}
.btn.sm{padding:8px 12px;font-size:14px;min-height:40px}
.btn.pri{display:block;width:100%;margin-top:14px;background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700;font-size:17px;padding:12px}
.btn.pri.sm{display:inline-block;width:auto;margin:0;font-size:15px;padding:8px 14px}
.btn.pri:disabled,.btn:disabled{opacity:.6}
.btn.dng{color:var(--red);border-color:var(--red);background:none}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;margin:4px 4px 0 0;background:var(--line);color:var(--tx);font-weight:600;vertical-align:middle;white-space:nowrap}
.tag.amb{background:var(--ambbg);color:var(--amb)}.tag.red{background:var(--redbg);color:var(--red)}.tag.grn{background:var(--grnbg);color:var(--grn)}
.tag.phCUF{background:#7A1F1F;color:#FFDCD7}.tag.phTFC{background:#6E4A0A;color:#FCE0A6}.tag.phTACEVAC{background:#1F5132;color:#BDEBCB}
.warn{background:var(--ambbg);color:var(--amb);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.warn.wl ul{margin:4px 0 0;padding-left:18px}.warn.wl li{margin:5px 0}
.prog{height:6px;background:var(--line);border-radius:3px;margin:6px 0 4px;overflow:hidden}.prog i{display:block;height:6px;width:0;background:var(--ok);border-radius:3px;transition:width .2s}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{flex:1;min-width:40px;min-height:44px;border:1px solid var(--tx2);background:none;color:var(--tx);border-radius:10px;padding:10px 0;font:inherit}
.chips button.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.opts button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:18px;padding:8px 12px;font:inherit;font-size:14px;min-height:40px;text-align:left}
.opts button small{font-size:11px;opacity:.75;font-weight:700}
.opts button.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
.opts button.krit.on{background:var(--redbg);color:var(--red);border-color:var(--red)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv b{color:var(--tx2);font-size:14px;font-weight:600}
.tw{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}.tw table{min-width:520px}
table{border-collapse:collapse;width:100%;font-size:14px} td,th{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top} th{background:var(--card)}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=search]{width:100%;font-size:18px;-webkit-appearance:none;appearance:none}
#q{margin-bottom:10px}
.row .sn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--tx2);font-size:13px;margin-top:2px}
[data-nl=l1]{text-transform:uppercase}[data-nl=l1]::placeholder{text-transform:none}
textarea{display:block;width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.toc button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:16px;padding:6px 12px;font:inherit;font-size:14px;min-height:40px}
.tabs{position:relative;display:flex;gap:6px;overflow-x:auto;margin:0 -12px 10px;padding:2px 12px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit;font-size:15px;min-height:42px}
.tabs button.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
.tabs button.done::before{content:"✓ ";color:var(--ok);font-weight:800}
.tabs button.on.done::before{color:inherit}
/* ── prekės ženklas ── */
.brand{display:flex;align-items:center;gap:10px;margin:2px 0 8px}.brand img{height:44px;width:44px}.brand span{font-size:13px;color:var(--tx2);line-height:1.3}.brand b{font-size:17px;color:var(--tx)}
.lg-l{display:none}body.learn .lg-d{display:none}body.learn .lg-l{display:inline}
@media(prefers-color-scheme:dark){body.learn .lg-d{display:inline}body.learn .lg-l{display:none}}
/* ── fazės ── */
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phase{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:12px 10px;text-decoration:none;min-height:104px;min-width:0}
.phase b{font-size:clamp(16px,4.6vw,24px);line-height:1.1;letter-spacing:-.3px;white-space:nowrap}
.phase span{font-size:13px;line-height:1.25;font-weight:600}
.phase small{font-size:12px;line-height:1.25;opacity:.85;margin-top:auto;padding-top:4px}
.fCUF{background:#7A1F1F;color:#FFDCD7}.fTFC{background:#6E4A0A;color:#FCE0A6}.fTAC{background:#1F5132;color:#BDEBCB}
.phead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 14px;margin:0 0 10px}
.phead b{font-size:24px;line-height:1}.phead .pht{font-size:16px;margin:0;font-weight:600;line-height:1.25}.phead small{display:block;font-weight:400;opacity:.85;font-size:13px}
.tmq{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}.tmq .btn{flex:1 1 60px;margin:0;padding-left:6px;padding-right:6px}.tmq .btn.pri.sm{flex:1 1 80px}
.tmq-ck{padding:6px 4px 12px 44px;border-bottom:1px solid var(--line)}
.tmini{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 12px;margin:0 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);text-decoration:none;font-size:14px}
.tmini .w{color:var(--amb)}.tmini .x{color:var(--red);font-weight:600}
body.field .tmini .x{color:#FF9C8F}
/* ── MEDEVAC įrankiai ── */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;align-content:center;padding:12px;border-radius:14px;background:var(--accbg);color:var(--acc);text-decoration:none;min-width:0;border:1px solid var(--accbg)}
.tool .ti{grid-row:1/3;width:40px;height:40px;border-radius:10px;background:var(--acc);color:var(--bg);font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
.tool b{font-size:17px;line-height:1.2;min-width:0}
.tool small{font-size:12px;line-height:1.25;opacity:.9;min-width:0}
.tools.sm{margin-top:14px}.tools.sm .tool{padding:8px 10px}.tools.sm .ti{width:32px;height:32px;font-size:17px;grid-row:auto}
.tfc{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px;margin:0 0 10px}
.tlr button{height:44px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;font-size:24px;line-height:1;font-weight:600;padding:0}
.tlr .sv{text-align:center;font-size:20px;font-weight:800}
.tp1{background:#B42318;color:#fff}.tp2{background:#F2C200;color:#1B1B1B}.tp3{background:#18794E;color:#fff}.tnb{background:#1B1B1B;color:#fff;box-shadow:inset 0 0 0 2px #8A8880}
.tq{border:2px solid var(--tx);border-radius:16px;background:var(--card);padding:12px 14px 14px;margin:0 0 12px}
.tqh{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.tqn{font-size:14px;font-weight:800;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px}
.tqq{font-size:30px;font-weight:800;line-height:1.15;margin:14px 0 6px;text-align:center}
.tqs{text-align:center;color:var(--tx2);font-size:15px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.yn button{min-height:92px;border-radius:14px;font:inherit;font-size:28px;font-weight:800;letter-spacing:1px;border:2px solid var(--tx);cursor:pointer}
.yn .yes{background:var(--tx);color:var(--bg)}.yn .no{background:var(--card);color:var(--tx)}
.yn button,.trnext,.tres .tbk,.tlr button,.tchild{touch-action:manipulation}.tchild{display:block;width:100%;margin-top:10px}.fchild{margin:8px 0 0}.trnext{margin-top:22px}
.tres{border-radius:16px;padding:16px 14px;margin:0 0 12px;text-align:center}
.trc{font-size:58px;font-weight:900;line-height:1;letter-spacing:1px}
.tnb .trc{font-size:36px}
.trn{font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-top:6px;line-height:1.2}
.tra{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.18);font-size:18px;font-weight:700}
.tp2 .tra{background:rgba(0,0,0,.1)}
.trw{font-size:14px;opacity:.92;margin-top:8px}
.trnext{display:block;width:100%;margin-top:14px;min-height:64px;font:inherit;font-size:21px;font-weight:800;background:#fff;color:#1B1B1B;border:0;border-radius:12px;cursor:pointer}
.tres .tbk{display:block;width:100%;margin-top:10px;background:transparent;color:inherit;border:1px solid currentColor}
.ttot{font-size:15px;color:var(--tx2)}.ttot b{color:var(--tx);font-size:18px}
.tlr{display:grid;grid-template-columns:52px 1fr 48px 44px 48px;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.tcat{display:inline-flex;align-items:center;justify-content:center;height:34px;border-radius:8px;font-weight:800;font-size:15px}
.tln{font-size:15px;line-height:1.2;min-width:0}
.tfc .fr{display:grid;grid-template-columns:minmax(0,1.15fr) auto minmax(0,1fr);align-items:center;gap:6px}
.tfc .fr.fend{grid-template-columns:minmax(0,1.15fr)}
.fq{border:2px solid var(--tx);border-radius:10px;padding:8px;font-weight:700;font-size:14px;line-height:1.25;background:var(--bg)}
.fq small{display:block;font-weight:400;color:var(--tx2);font-size:12px}
.fr.cur .fq{box-shadow:0 0 0 3px var(--hl)}
.fy{font-size:12px;font-weight:800;color:var(--tx2);white-space:nowrap}
.fo{border-radius:10px;padding:8px 6px;font-weight:800;font-size:15px;line-height:1.2;text-align:center}
.fo small{display:block;font-weight:600;font-size:11.5px;margin-top:2px}
.fo.fsub{background:var(--bg);border:1px dashed var(--tx2);color:var(--tx);font-weight:700;font-size:13px}
.fsub span{display:flex;gap:4px;margin-top:6px}.fsub b{flex:1;border-radius:6px;padding:3px 2px;font-size:14px;line-height:1.1}.fsub b small{display:block;font-size:10.5px;font-weight:700;margin:0}
.fn{position:relative;font-size:12px;font-weight:800;color:var(--tx2);padding:5px 0 5px 22px;margin-left:12px;border-left:2px solid var(--tx2)}
.tnotes{margin:6px 0 0;padding-left:18px}.tnotes li{margin:4px 0}
/* ── laikmačiai ── */
.tmrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tmc{display:flex;flex-direction:column;align-items:flex-start;gap:1px;margin:0;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;text-align:left;min-width:0}
.tmc .muted{font-size:12px}.tmc b{font-size:clamp(16px,5vw,20px);line-height:1.2}.tmc small{font-size:12px;line-height:1.25;color:var(--tx2)}
.tmc.warn{margin:0;padding:10px;background:var(--ambbg);color:var(--amb);border-color:var(--ambbg);font-size:inherit}.tmc.warn small,.tmc.warn .muted{color:var(--amb)}
.tmc.bad{background:var(--redbg);color:var(--red);border-color:var(--redbg)}.tmc.bad small,.tmc.bad .muted{color:var(--red)}
.tmc.dim b{color:var(--tx2)}
.tme{margin-top:8px;scroll-margin-bottom:calc(100px + env(safe-area-inset-bottom))}.tme .muted{margin:4px 0 0}.tmb{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}.tmb input{flex:1 1 100%;min-width:0;font-size:20px}.tmb .btn{flex:1 1 auto}
/* ── kontroliniai sąrašai ── */
.cl .cnt{text-align:right}
.clh{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx2);margin:16px 0 0}
.ck{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;-webkit-user-select:none;user-select:none}
.ck .t{flex:1;min-width:0}
.ck .t .muted{margin-top:4px;-webkit-user-select:text;user-select:text}
.bx{flex:none;width:28px;height:28px;border:2px solid var(--tx2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;color:transparent;margin-top:-1px}
.ck.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.ck.on .t{color:var(--tx2)}
.ck.on .t>.tt{text-decoration:line-through}
.ck.key .t{font-weight:600}
.ck.key .t ul,.ck.key .t .muted{font-weight:400}
.ck ul{margin:4px 0 0;padding-left:18px;color:var(--tx2);font-size:15px}
.ck .lk{flex:none;display:flex;flex-direction:column;gap:8px;align-items:flex-end;margin:-6px 0}
.sk{display:inline-flex;align-items:center;justify-content:center;min-height:40px;min-width:48px;padding:6px 10px;border:0;border-radius:10px;background:var(--accbg);color:var(--acc);font:inherit;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.sk.tmk{background:var(--ambbg);color:var(--amb)}
/* ── vaistai, įgūdžiai ── */
